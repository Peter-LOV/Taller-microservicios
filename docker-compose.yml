name: taller

x-java-env: &java-env
  EUREKA_URL: http://eureka:8761/eureka
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"

x-db-env: &db-env
  DB_NAME: ${POSTGRES_DB:-laboratorio}
  DB_PRIMARY_HOST: primary
  DB_PRIMARY_PORT: "5432"
  DB_REPLICA1_HOST: replica1
  DB_REPLICA1_PORT: "5432"
  DB_REPLICA2_HOST: replica2
  DB_REPLICA2_PORT: "5432"

x-catalogo: &catalogo
  build: {context: ., args: {MODULE: servicio-catalogo}}
  image: taller/servicio-catalogo:latest
  depends_on:
    eureka: {condition: service_healthy}
    primary: {condition: service_healthy}
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health | grep -q UP"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 25s

services:
  # ------------------------- PostgreSQL: 1 primario + 2 replicas -------------------------
  primary:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-laboratorio}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Defina REPLICATION_PASSWORD en .env}
      CATALOGO_DB_PASSWORD: ${CATALOGO_DB_PASSWORD:?Defina CATALOGO_DB_PASSWORD en .env}
      PEDIDOS_DB_PASSWORD: ${PEDIDOS_DB_PASSWORD:?Defina PEDIDOS_DB_PASSWORD en .env}
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10",
              "-c", "wal_keep_size=256MB", "-c", "hot_standby=on", "-c", "cluster_name=primary"]
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./docker/primary-init.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
      - ./docker/schema-init.sh:/docker-entrypoint-initdb.d/02-schema.sh:ro
    ports:
      - "${PG_PRIMARY_PORT:-5437}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-laboratorio}"]
      interval: 5s
      timeout: 3s
      retries: 20

  replica1:
    image: postgres:17
    user: postgres
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: ${REPLICATION_PASSWORD:?Defina REPLICATION_PASSWORD en .env}
      CLUSTER_NAME: replica1
    entrypoint: ["/bin/bash", "/scripts/start-replica.sh"]
    volumes:
      - replica1_data:/var/lib/postgresql/data
      - ./docker/start-replica.sh:/scripts/start-replica.sh:ro
    ports:
      - "${PG_REPLICA1_PORT:-5438}:5432"
    depends_on:
      primary: {condition: service_healthy}

  replica2:
    image: postgres:17
    user: postgres
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: ${REPLICATION_PASSWORD:?Defina REPLICATION_PASSWORD en .env}
      CLUSTER_NAME: replica2
    entrypoint: ["/bin/bash", "/scripts/start-replica.sh"]
    volumes:
      - replica2_data:/var/lib/postgresql/data
      - ./docker/start-replica.sh:/scripts/start-replica.sh:ro
    ports:
      - "${PG_REPLICA2_PORT:-5439}:5432"
    depends_on:
      primary: {condition: service_healthy}

  # ------------------------- Descubrimiento y entrada -------------------------
  eureka:
    build: {context: ., args: {MODULE: eureka-server}}
    image: taller/eureka-server:latest
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8761/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  gateway:
    build: {context: ., args: {MODULE: api-gateway}}
    image: taller/api-gateway:latest
    environment:
      <<: *java-env
    depends_on:
      eureka: {condition: service_healthy}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  # ------------------------- Microservicios de negocio -------------------------
  catalogo-1:
    <<: *catalogo
    environment:
      <<: [*java-env, *db-env]
      INSTANCE_ID: catalogo-1
      DB_USER: catalogo_user
      DB_PASSWORD: ${CATALOGO_DB_PASSWORD:?Defina CATALOGO_DB_PASSWORD en .env}
    ports:
      - "8081:8080"

  catalogo-2:
    <<: *catalogo
    environment:
      <<: [*java-env, *db-env]
      INSTANCE_ID: catalogo-2
      DB_USER: catalogo_user
      DB_PASSWORD: ${CATALOGO_DB_PASSWORD:?Defina CATALOGO_DB_PASSWORD en .env}
    ports:
      - "8082:8080"

  pedidos:
    build: {context: ., args: {MODULE: servicio-pedidos}}
    image: taller/servicio-pedidos:latest
    environment:
      <<: [*java-env, *db-env]
      INSTANCE_ID: pedidos-1
      DB_USER: pedidos_user
      DB_PASSWORD: ${PEDIDOS_DB_PASSWORD:?Defina PEDIDOS_DB_PASSWORD en .env}
    depends_on:
      eureka: {condition: service_healthy}
      primary: {condition: service_healthy}
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

volumes:
  primary_data:
  replica1_data:
  replica2_data:

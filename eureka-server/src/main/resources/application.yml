server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false   # el servidor no se registra a si mismo
    fetch-registry: false
  server:
    # Ajustes SOLO PARA EL LABORATORIO: detectar caidas en segundos en lugar de ~90 s.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 3000
    response-cache-update-interval-ms: 3000
    use-read-only-response-cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
